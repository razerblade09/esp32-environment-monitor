; ESP32 Environmental Monitor - firmware build configuration
; Target: bare ESP32-WROOM-32 module (see hardware/schematic)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@~6.9.0
board = esp32dev
framework = espidf

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -Wall
    -Wextra
    -Werror=return-type
