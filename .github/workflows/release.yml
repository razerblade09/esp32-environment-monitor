name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          ./firmware/build.sh

      - name: Name the image after the tag
        run: |
          cp firmware/dist/esp32_environment_monitor.bin \
             "esp32_environment_monitor-${GITHUB_REF_NAME}.bin"
          sha256sum "esp32_environment_monitor-${GITHUB_REF_NAME}.bin" \
            > "esp32_environment_monitor-${GITHUB_REF_NAME}.bin.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            esp32_environment_monitor-*.bin
            esp32_environment_monitor-*.bin.sha256
