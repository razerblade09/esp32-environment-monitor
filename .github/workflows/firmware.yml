name: Firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          clang-format --dry-run -Werror --style=file:firmware/.clang-format \
            $(git ls-files 'firmware/*.c' 'firmware/*.h')

  build:
    name: Build (ESP-IDF v5.3.1)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          ./firmware/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: esp32_environment_monitor
          path: firmware/dist/esp32_environment_monitor.bin
